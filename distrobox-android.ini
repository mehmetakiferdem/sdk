[gemstone-android]
image=gemstone-android
init=true
nvidia=false
pull=false
root=false
start_now=true
hostname="gemstone-android"
home="$PWD/.distrobox-android"
volume="$PWD:/home/workdir"
additional_packages="systemd"
additional_flags="--security-opt label=disable"
init_hooks="mount -i -o remount,exec,dev /home/workdir"
init_hooks="mount -i -o remount,exec,dev /run"
