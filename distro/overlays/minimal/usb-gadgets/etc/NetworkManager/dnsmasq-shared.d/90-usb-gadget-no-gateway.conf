# The USB gadget links give the computer an address to reach the board on, not
# a way to the internet: an empty router and DNS option keep the computer from
# routing all its traffic, and DNS, through the board. dnsmasq tags each
# request with the interface it arrived on; the hotspot keeps both options.
dhcp-option=tag:usb0,option:router
dhcp-option=tag:usb0,option:dns-server
dhcp-option=tag:usb1,option:router
dhcp-option=tag:usb1,option:dns-server
